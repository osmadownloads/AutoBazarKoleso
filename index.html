<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoBazár Koleso – Used Cars in Europe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap">
    <div class="nav">
      <a class="logo" href="index.html">AutoBazár<span>Koleso</span></a>
      <div class="nav-controls">
        <nav>
          <a href="index.html" data-i18n="navBuy" aria-current="page">Buy</a>
          <a href="sell.html" data-i18n="navSell">Sell</a>
          <a href="financing.html" data-i18n="navFinancing">Financing</a>
          <a href="contact.html" data-i18n="navContact">Contact</a>
        </nav>
        <label class="language-label">
          <span class="visually-hidden" data-i18n="languageLabel">Language</span>
          <select id="language" aria-label="Language">
            <option value="en">English</option>
            <option value="sk">Slovenčina</option>
            <option value="ru">Русский</option>
          </select>
        </label>
      </div>
    </div>
    <div class="hero">
      <h1 data-i18n="heroTitle">Quality used cars across Europe</h1>
      <p data-i18n="heroDescription">Browse inspected used vehicles from trusted dealers in 12 European cities. Filter by price, year, brand, model, location, and condition.</p>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="layout">

      <aside id="filters">
        <h2><span data-i18n="filters">Filters</span> <button class="reset" id="resetBtn" data-i18n="reset">Reset all</button></h2>

        <div class="field">
          <label class="t" for="priceMin" data-i18n="price">Price (€)</label>
          <div class="row">
            <input type="number" id="priceMin" placeholder="Min" data-i18n-placeholder="min" data-i18n-aria-label="minimumPrice" aria-label="Minimum price" min="0" step="500">
            <input type="number" id="priceMax" placeholder="Max" data-i18n-placeholder="max" data-i18n-aria-label="maximumPrice" aria-label="Maximum price" min="0" step="500">
          </div>
        </div>

        <div class="field">
          <label class="t" for="yearMin" data-i18n="year">Year of production</label>
          <div class="row">
            <input type="number" id="yearMin" placeholder="From" data-i18n-placeholder="from" data-i18n-aria-label="yearFrom" aria-label="Year from" min="1990" max="2026">
            <input type="number" id="yearMax" placeholder="To" data-i18n-placeholder="to" data-i18n-aria-label="yearTo" aria-label="Year to" min="1990" max="2026">
          </div>
        </div>

        <div class="field">
          <label class="t" for="brand" data-i18n="brand">Car brand</label>
          <select id="brand"><option value="" data-i18n="allBrands">All brands</option></select>
        </div>

        <div class="field">
          <label class="t" for="series" data-i18n="model">Brand series / model</label>
          <select id="series" disabled><option value="" data-i18n="selectBrandFirst">Select a brand first</option></select>
        </div>

        <div class="field">
          <label class="t" for="locality" data-i18n="location">Locality</label>
          <select id="locality"><option value="" data-i18n="allEurope">All of Europe</option></select>
        </div>

        <div class="field">
          <label class="t" data-i18n="condition">Vehicle condition</label>
          <div class="checks" id="conditions"></div>
        </div>
      </aside>

      <section>
        <div class="toolbar">
          <span class="count" id="count"></span>
          <div class="toolbar-controls">
            <button class="mobile-toggle" id="toggleFilters" data-i18n="filters">Filters</button>
            <label class="visually-hidden" for="sort" data-i18n="sortLabel">Sort results</label>
            <select id="sort">
              <option value="priceAsc" data-i18n="priceAsc">Price: low to high</option>
              <option value="priceDesc" data-i18n="priceDesc">Price: high to low</option>
              <option value="yearDesc" data-i18n="yearDesc">Year: newest first</option>
              <option value="yearAsc" data-i18n="yearAsc">Year: oldest first</option>
              <option value="kmAsc" data-i18n="kmAsc">Mileage: lowest first</option>
            </select>
          </div>
        </div>
        <div class="grid" id="grid"></div>
      </section>

    </div>
  </div>
</main>

<footer data-i18n="footer">© 2026 AutoBazár Koleso – demo website. Listings are sample data.</footer>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="scripts.js"></script>
</body>
</html>
