<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car details – AutoBazár Koleso</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap">
    <div class="nav">
      <a class="logo" href="index.html">AutoBazár<span>Koleso</span></a>
      <div class="nav-controls">
        <nav>
          <a href="index.html" data-i18n="navBuy" aria-current="page">Buy</a>
          <a href="sell.html" data-i18n="navSell">Sell</a>
          <a href="financing.html" data-i18n="navFinancing">Financing</a>
          <a href="contact.html" data-i18n="navContact">Contact</a>
        </nav>
        <label class="language-label">
          <span class="visually-hidden" data-i18n="languageLabel">Language</span>
          <select id="language" aria-label="Language">
            <option value="en">English</option>
            <option value="sk">Slovenčina</option>
            <option value="ru">Русский</option>
          </select>
        </label>
      </div>
    </div>
    <div class="hero">
      <div class="crumbs"><a href="index.html" data-i18n="backToCars">← All cars</a></div>
      <h1 id="carTitle"></h1>
      <p id="carSub"></p>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="layout reverse">
      <section id="carMain"></section>
      <aside class="always" id="buyBox"></aside>
    </div>
  </div>
</main>

<footer data-i18n="footer">© 2026 AutoBazár Koleso – demo website. Listings are sample data.</footer>

<script src="i18n.js"></script>
